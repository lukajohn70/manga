version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: manga-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manga_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-manga_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
      - ./seed-catalog.sql:/docker-entrypoint-initdb.d/seed-catalog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manga_user} -d ${POSTGRES_DB:-manga_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manga-internal

  # ============================================================================
  # 2. Redis 7 Cache & Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: manga-prod-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manga-internal

  # ============================================================================
  # 3. Backend Modular Monolith API
  # ============================================================================
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: manga-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-manga_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-manga_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT Secret required}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://manga.ng,https://www.manga.ng}
    networks:
      - manga-internal

  # ============================================================================
  # 4. Outbox & Notification Worker (Termii SMS / WhatsApp)
  # ============================================================================
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: manga-prod-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-manga_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-manga_db}
      REDIS_URL: redis://redis:6379
      TERMII_API_KEY: ${TERMII_API_KEY}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-Manga}
      TERMII_WHATSAPP_DEVICE_ID: ${TERMII_WHATSAPP_DEVICE_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
    networks:
      - manga-internal

  # ============================================================================
  # 5. Next.js Customer Storefront
  # ============================================================================
  web-store:
    build:
      context: ..
      dockerfile: apps/web-store/Dockerfile
    container_name: manga-prod-web-store
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.manga.ng}
      NEXT_PUBLIC_VENDOR_URL: ${NEXT_PUBLIC_VENDOR_URL:-https://vendor.manga.ng}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://admin.manga.ng}
    networks:
      - manga-internal

  # ============================================================================
  # 6. Nginx Reverse Proxy with TLS
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: manga-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web-store
      - api
    networks:
      - manga-internal

  # ============================================================================
  # 7. Let's Encrypt Certbot SSL Automation
  # ============================================================================
  certbot:
    image: certbot/certbot
    container_name: manga-prod-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - manga-internal

networks:
  manga-internal:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  certbot_etc:
  certbot_www:
