events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=3r/s;

    # Upstream Services
    upstream web_store {
        server web-store:3000;
    }

    upstream api_backend {
        server api:4000;
    }

    # ==========================================================================
    # HTTP: Redirect all plain HTTP traffic to HTTPS (and Certbot challenges)
    # ==========================================================================
    server {
        listen 80;
        server_name manga.ng www.manga.ng api.manga.ng vendor.manga.ng admin.manga.ng;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS: Main Customer Storefront (manga.ng & www.manga.ng)
    # ==========================================================================
    server {
        listen 443 ssl;
        server_name manga.ng www.manga.ng;

        ssl_certificate /etc/letsencrypt/live/manga.ng/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/manga.ng/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://web_store;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js Static Cache
        location /_next/static/ {
            proxy_pass http://web_store;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ==========================================================================
    # HTTPS: Backend Modular Monolith API (api.manga.ng)
    # ==========================================================================
    server {
        listen 443 ssl;
        server_name api.manga.ng;

        ssl_certificate /etc/letsencrypt/live/manga.ng/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/manga.ng/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Paystack Webhook (No rate limit to prevent dropping payment receipts)
        location /v1/payments/webhook {
            proxy_pass http://api_backend/v1/payments/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_body on;
        }

        # General API with Rate Limiting
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
