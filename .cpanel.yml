---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/manga.jlm.com.ng/
    - /bin/rm -f $DEPLOYPATH/index.html
    - /bin/rm -f $DEPLOYPATH/index.htm
    - /bin/rm -rf $DEPLOYPATH/apps/web-store/.next/server/route-cache
    - /bin/rm -rf $DEPLOYPATH/apps/web-store/.next/cache
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/bash ./infra/deploy-cpanel.sh
    - /usr/bin/pkill -f "server.js" || true
